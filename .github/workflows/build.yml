name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify META-INF/xposed packaging
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk')
          unzip -l "$APK" | grep -E "META-INF/xposed/(java_init.list|module.prop|scope.list)"
          echo "META-INF/xposed packaging verified"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperVolumePager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK (unsigned)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release packaging
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk')
          unzip -l "$APK" | grep -E "META-INF/xposed/(java_init.list|module.prop|scope.list)"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperVolumePager-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
